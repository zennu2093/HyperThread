<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperThreadMy - E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="logo">HyperThreadMy</div>
        <nav>
            <a href="#">Home</a>
            <a href="#products">Products</a>
            <a href="#cart">Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <!-- Hero / Banner Section -->
    <section class="hero">
        <h1>Welcome to HyperThreadMy</h1>
        <p>Your destination for premium apparel and accessories.</p>
    </section>

    <!-- Products Section -->
    <section id="products" class="products-container">
        <h2>Our Products</h2>
        <div class="product-grid" id="product-list">
            <!-- JavaScript dynamically will insert products here -->
        </div>
    </section>

    <!-- Shopping Cart Section -->
    <section id="cart" class="cart-section">
        <h2>Your Shopping Cart</h2>
        <div id="cart-items">
            <p>Your cart is empty.</p>
        </div>
        <div class="cart-total">
            <h3>Total: $<span id="total-price">0.00</span></h3>
            <button onclick="checkout()">Checkout</button>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 HyperThreadMy. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
