<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperThreadMy - Shop Template Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Control Bar -->
    <header class="control-bar">
        <div class="brand">HyperThreadMy <span>Template Engine</span></div>
        <div class="controls">
            <label for="templateSelect">Select Theme Style:</label>
            <select id="templateSelect" onchange="changeTemplate(this.value)">
                <option value="streetwear">Streetwear / Urban (Dark)</option>
                <option value="minimalist">Minimalist Tech (Clean)</option>
                <option value="luxury">Luxury Apparel (Gold Accent)</option>
            </select>
        </div>
    </header>

    <!-- Main Live Showcase Area -->
    <main id="store-preview" class="theme-streetwear">
        
        <!-- Hero Banner Section -->
        <section class="hero">
            <h1 id="hero-title">HYPERTHREAD STREETWEAR</h1>
            <p id="hero-subtitle">Next-gen apparel engineered for the movement.</p>
            <button class="cta-btn">Shop Collection</button>
        </section>

        <!-- Product Grid -->
        <section class="products-section">
            <h2>Featured Products</h2>
            <div class="product-grid">
                
                <div class="product-card">
                    <div class="img-box">
                        <span class="badge">Hot</span>
                        <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=500&q=80" alt="Hoodie">
                    </div>
                    <h3>HyperThread Cyber Hoodie</h3>
                    <p class="price">$85.00</p>
                    <button class="add-btn">Add To Cart</button>
                </div>

                <div class="product-card">
                    <div class="img-box">
                        <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=500&q=80" alt="T-Shirt">
                    </div>
                    <h3>Oversized Graphic Tee</h3>
                    <p class="price">$42.00</p>
                    <button class="add-btn">Add To Cart</button>
                </div>

                <div class="product-card">
                    <div class="img-box">
                        <img src="https://images.unsplash.com/photo-1588850561407-ed78c282e89b?auto=format&fit=crop&w=500&q=80" alt="Cap">
                    </div>
                    <h3>Tactical Headwear</h3>
                    <p class="price">$30.00</p>
                    <button class="add-btn">Add To Cart</button>
                </div>

            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
